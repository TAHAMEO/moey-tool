# Builds the Windows installer and runs the real setup.exe silently on Windows Server 2022 and 2025.
# CLIPFORGE installs as an ordinary Windows app (no Docker, no Linux, no administrator rights): the
# test checks that it answers on http://localhost:3000 without a sign-in, stops and starts again,
# updates in place, and uninstalls. Only the 1.8 GB speech model is skipped.
name: Windows installer

on:
  push:
    paths:
      - "installer/windows/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Build ClipForge-Setup.exe (and the standalone web app inside it)
        run: installer/windows/build.sh
      - name: Test the installer scripts
        run: pwsh -NoProfile -File installer/windows/tests/run-tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Setup
          path: installer/windows/build/ClipForge-Setup-*.exe*

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse in Windows PowerShell 5.1 (what Windows 10/11 ship)
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem installer/windows/scripts/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "$($file.Name): $($_.Message)" }; exit 1 }
            "$($file.Name) parses"
          }
      - name: Started like setup.exe starts it (32-bit, input that never ends), the script switches to 64-bit and never waits on a program
        shell: powershell
        run: |
          foreach ($ps in @("$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe", "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe")) {
            "== $ps"
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = $ps
            $info.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$PWD\installer\windows\scripts\install.ps1`" -Step check -InstallDir `"$env:RUNNER_TEMP\check`""
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true   # kept open and never written, like setup.exe's
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($info)
            $reads = @($p.StandardOutput.ReadToEndAsync(), $p.StandardError.ReadToEndAsync())
            if (-not $p.WaitForExit(300000)) { $p.Kill(); "FAILED: the check was still waiting after 5 minutes"; exit 1 }
            [void][System.Threading.Tasks.Task]::WaitAll([System.Threading.Tasks.Task[]]$reads, 10000)
            $out = $reads[0].Result + $reads[1].Result
            $out
            $expected = @("64-bit process: True", "Program output check OK", "Background start check OK", "Input check OK", "Time limit check OK", "Argument quoting check OK")
            $missing = @($expected | Where-Object { $out -notmatch [regex]::Escape($_) })
            if ($p.ExitCode -ne 0 -or $missing) { "FAILED (exit code $($p.ExitCode); missing: $($missing -join ', '))"; exit 1 }
          }

  windows-setup:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipForge-Setup
          path: setup
      - name: setup.exe, silently - install, run, stop, start, update, uninstall
        shell: powershell
        env:
          CLIPFORGE_SKIP_SPEECH_MODEL: "1"   # 1.8 GB from a slow server; everything else is real
        run: |
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free } | Sort-Object Free -Descending | Select-Object -First 1
          $dir = Join-Path $drive.Root "ClipForge Test"   # a space in the path, on purpose
          $exe = (Get-ChildItem setup\ClipForge-Setup-*.exe | Select-Object -First 1).FullName
          $problems = @()

          function Invoke-Setup([string]$Path, [string[]]$Arguments, [int]$Minutes = 40) {
            $started = Get-Date
            $p = Start-Process -FilePath $Path -ArgumentList $Arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($Minutes * 60 * 1000)) {
              Write-Host "$Path did not finish within $Minutes minutes."
              $log = Join-Path $dir "install.log"
              if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
              Stop-Process -Id $p.Id -Force
              exit 1
            }
            Write-Host "$([IO.Path]::GetFileName($Path)) $($Arguments -join ' ') -> exit code $($p.ExitCode) after $([int]((Get-Date) - $started).TotalSeconds) s"
            return [int]$p.ExitCode
          }
          function Test-Ready { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://localhost:3000/api/health/ready").StatusCode -eq 200 } catch { $false } }
          function Show-Logs {
            Write-Host "----- install.log -----"; Get-Content (Join-Path $dir "install.log") -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            foreach ($log in Get-ChildItem (Join-Path $dir "logs") -Filter *.log -ErrorAction SilentlyContinue) {
              Write-Host "----- logs\$($log.Name) (last 40 lines) -----"; Get-Content $log.FullName -Tail 40 | ForEach-Object { Write-Host $_ }
            }
          }
          function Launcher([string]$Action) {
            $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir "app\installer\windows\scripts\clipforge.ps1") $Action -NoWindow 2>&1 | Out-String
            Write-Host $out
            return $LASTEXITCODE
          }

          # 1. Install.
          $code = Invoke-Setup $exe @("/S", "/D=$dir")
          if ($code -ne 0) { Show-Logs; "FAILED: setup.exe exit code $code"; exit 1 }
          $log = Get-Content -Raw (Join-Path $dir "install.log")
          foreach ($line in @("Setup runs in PowerShell 5.1", "(64-bit)", "uv checksum verified", "Python and all components are installed", "CLIPFORGE is set up", "CLIPFORGE is running at http://localhost:3000")) {
            if (-not $log.Contains($line)) { $problems += "install.log lacks: $line" }
          }
          if ($log -match "is not recognized|ERROR:") { $problems += "install.log reports an error" }
          if (-not (Test-Ready)) { $problems += "CLIPFORGE does not answer on http://localhost:3000 after setup" }

          # 2. No sign-in: this browser is the owner straight away.
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $me = Invoke-RestMethod -UseBasicParsing -WebSession $session "http://localhost:3000/api/auth/me"
          "auth/me: $($me | ConvertTo-Json -Compress)"
          if ($me.role -ne "owner" -or -not $me.local) { $problems += "a sign-in would be needed" }
          $schedule = Invoke-RestMethod -UseBasicParsing -WebSession $session "http://localhost:3000/api/schedule"
          if ($null -eq $schedule.ready) { $problems += "the Schedule page's API doesn't answer" }
          $diag = Invoke-RestMethod -UseBasicParsing -WebSession $session "http://localhost:3000/api/diagnostics"
          "diagnostics: database=$($diag.database.ok) ffmpeg=$($diag.ffmpeg.ok) workers=$($diag.workers.ok) memory=$($diag.memory.ok) downloader=$($diag.downloader.ok)"
          foreach ($part in @("database", "ffmpeg", "workers", "memory", "downloader")) { if (-not $diag.$part.ok) { $problems += "diagnostics: $part is not OK" } }
          foreach ($page in @("/", "/schedule", "/videos", "/settings")) {
            $status = try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 "http://localhost:3000$page").StatusCode } catch { "$_" }
            "page $page -> $status"
            if ($status -ne 200) { $problems += "page $page answered $status" }
          }
          foreach ($link in @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CLIPFORGE\CLIPFORGE.lnk", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CLIPFORGE\Stop CLIPFORGE.lnk")) {
            if (-not (Test-Path $link)) { $problems += "missing shortcut $link" }
          }
          # Listening on this PC only.
          $open = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 3000, 38100, 38101 }
          $open | ForEach-Object { "listening: $($_.LocalAddress):$($_.LocalPort)" }
          if ($open | Where-Object { $_.LocalAddress -notin "127.0.0.1", "::1" }) { $problems += "something listens beyond this PC" }

          # 3. Stop and start again with the launcher (what the shortcuts do).
          if ((Launcher "stop") -ne 0) { $problems += "the launcher couldn't stop CLIPFORGE" }
          Start-Sleep -Seconds 3
          if (Test-Ready) { $problems += "CLIPFORGE still answers after stop" }
          if ((Launcher "start") -ne 0 -or -not (Test-Ready)) { $problems += "CLIPFORGE didn't start again" }

          # 4. Update: run setup again over the running installation; data is kept.
          $code = Invoke-Setup $exe @("/S", "/D=$dir")
          if ($code -ne 0) { $problems += "running setup again (update) failed: $code" }
          $again = Invoke-RestMethod -UseBasicParsing -WebSession (New-Object Microsoft.PowerShell.Commands.WebRequestSession) "http://localhost:3000/api/auth/me"
          if ($again.id -ne $me.id) { $problems += "the update lost the existing data" }

          # 5. Uninstall (keeping data, the default).
          $code = Invoke-Setup (Join-Path $dir "Uninstall.exe") @("/S", "_?=$dir") 10
          if (Test-Ready) { $problems += "CLIPFORGE still answers after uninstall" }
          if (Test-Path (Join-Path $dir "runtime")) { $problems += "the uninstaller left the runtime behind" }
          if (-not (Test-Path (Join-Path $dir "data\postgres"))) { $problems += "the uninstaller deleted the data although asked to keep it" }

          if ($problems) { Show-Logs; $problems | ForEach-Object { "FAILED: $_" }; exit 1 }
          Show-Logs
          "OK: installed, answered without sign-in, stopped, started, updated and uninstalled"
