[project]
name = "clipforge"
version = "0.1.0"
description = "CLIPFORGE AI - autonomous AI video production, link ingestion, memory, learning and publishing platform (backend)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # --- API / web ---
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.34",
    "pydantic[email]==2.14.3",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    # --- Database / queue ---
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
    "redis==8.1.0",
    # --- Security ---
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    # --- Brain / memory (catalog items 1 and 2) ---
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "langchain-core==1.8.2",
    "mem0ai==2.2.1",
    "langchain==1.5.0",
    # --- Video pipeline ---
    "scenedetect==0.7.3",
    "opencv-contrib-python-headless==5.1.0.95",
    "mediapipe==1.2.3",
    "vosk==0.3.45",
    "faster-whisper==1.2.1",
    "pysubs2==1.9.1",
    "numpy>=2.1,<2.6",
    "pillow==13.0.0",
    "pyspellchecker==0.9.1",
    # --- Publishing ---
    "aiohttp>=3.9",
    "instagram-python-sdk @ git+https://github.com/Inoue-AI/Inoue-AI-Instagram-SDK.git@5fcda416135c6d24277384b6208b98faf4f70cd8",
    # --- Storage ---
    "boto3==1.44.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.5",
]

[project.scripts]
clipforge = "clipforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipforge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# MediaPipe depends on opencv-contrib-python and PySceneDetect on opencv-python.
# Both install a GUI-enabled cv2 that collides with the headless build servers
# need. Exclude them and provide cv2 through opencv-contrib-python-headless.
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = [
    "slow: long-running media tests",
    "contract: tests against local fake implementations of external APIs (not real platform integration)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form",
                          "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# Vendored third-party code (AutoClip, MIT) is kept close to upstream to ease re-syncing.
"clipforge/vendor/**" = ["BLE001", "RUF059", "I001", "FURB167", "SIM115", "PLW1510"]
